server:
  port: 8080

spring:
  application:
    name: playyourlist
  datasource:
    url: jdbc:h2:mem:playyourlist;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always

# URL base usada pelos clientes OpenFeign do microsserviço "api" para
# chamar os endpoints de musicas/playlists/reproducao, que rodam dentro
# desta mesma aplicacao (ver observacao no README sobre a arquitetura).
app:
  base-url: http://localhost:${server.port}
