spring.application.name=login-service
server.port=8080

# ---------- Banco de dados (H2 em memoria) ----------
spring.datasource.url=jdbc:h2:mem:segurancadb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.sql.init.mode=always
spring.h2.console.enabled=false

# ---------- Regras de negocio ----------
# Quantidade de falhas toleradas. O usuario e bloqueado quando failed_attempts > max-falhas
# ("Caso o usuario falhe mais de uma vez no login ele deve ser bloqueado" => 2a falha bloqueia)
app.seguranca.max-falhas=1

# Usuarios operacionais (JdbcUserDetailsManager) criados na inicializacao
app.seguranca.admin.username=admin
app.seguranca.admin.password=admin123
app.seguranca.manutencao.username=manutencao
app.seguranca.manutencao.password=manut123

# ---------- Actuator / Metricas ----------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
management.info.java.enabled=true
info.app.name=@project.name@
info.app.description=@project.description@
info.app.version=@project.version@

# ---------- OpenAPI / Swagger ----------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.show-actuator=false
